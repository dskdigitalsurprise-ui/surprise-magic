<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Surprise - DSK Magic</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white; font-family: 'Arial', sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; text-align: center; overflow-x: hidden;
        }
        .container { padding: 20px; width: 90%; max-width: 400px; }
        .gift-box {
            font-size: 80px; margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
        h1 { font-size: 1.5rem; color: #f1c40f; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        #message-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px; border-radius: 15px;
            border: 1px solid #f1c40f; margin-top: 20px;
            display: none; animation: fadeIn 1s;
        }
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
        .branding { margin-top: 50px; font-size: 0.8rem; color: #bdc3c7; }
        .order-btn {
            display: inline-block; margin-top: 25px;
            padding: 15px 25px; background: #e74c3c;
            color: white; text-decoration: none;
            border-radius: 50px; font-weight: bold;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gift-box">🎁</div>
        <h1 id="status">Tap to Reveal Surprise</h1>
        
        <div id="message-box">
            <p id="display-text"></p>
        </div>

        <a href="index.html" class="order-btn">Doston, Kya aap bhi aisa Jadu wala QR banwana chahte hain? <br> [CLICK HERE TO ORDER NOW]</a>

        <div class="branding">
            <p>DSK DIGITAL SURPRISE</p>
            <p>POWERED BY DANISH KHAN</p>
            <p style="font-size: 10px;">TM NO: 13512170 (CLASS: 42)</p>
        </div>
    </div>

    <script>
        // --- YE 2 LINE HAR CUSTOMER KE LIYE BADALNI HAIN ---
        const CUSTOMER_NAME = "Danish"; 
        const CUSTOMER_DIALOGUE = "Happy Birthday Rahul! Aap hamesha khush raho aur aise hi muskurate raho.";
        // ---------------------------------------------------

        const statusText = document.getElementById('status');
        const messageBox = document.getElementById('message-box');
        const displayText = document.getElementById('display-text');

        document.body.onclick = () => {
            if (statusText.innerText === "Tap to Reveal Surprise") {
                startMagic();
            }
        };

        function startMagic() {
            statusText.innerText = "Listening to Magic...";
            
            // Step 1: Intro Voice
            const introMsg = new SpeechSynthesisUtterance(`Hi, kaise hain aap? ${CUSTOMER_NAME} ne aapke liye ek magic surprise bheja hai. Suniye...`);
            introMsg.lang = 'hi-IN';
            introMsg.rate = 0.9;

            window.speechSynthesis.speak(introMsg);

            // Step 2: Main Dialogue (Starts after intro)
            introMsg.onend = () => {
                messageBox.style.display = "block";
                displayText.innerText = CUSTOMER_DIALOGUE;
                
                const mainMsg = new SpeechSynthesisUtterance(CUSTOMER_DIALOGUE);
                mainMsg.lang = 'hi-IN';
                mainMsg.rate = 0.9;
                window.speechSynthesis.speak(mainMsg);
                
                mainMsg.onend = () => {
                    statusText.innerText = "Magic Finished! ✨";
                };
            };
        }
    </script>
</body>
</html>
