<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSK Digital Magic</title>
    <style>
        body { margin: 0; background: radial-gradient(circle, #1a1a2e, #16213e); color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; overflow: hidden; }
        #cust-photo { width: 250px; height: 250px; border-radius: 50%; border: 6px solid #f1c40f; margin: 20px auto; display: none; object-fit: cover; box-shadow: 0 0 30px rgba(241, 196, 15, 0.5); }
        .gift-box { font-size: 100px; cursor: pointer; animation: shake 0.6s infinite; }
        @keyframes shake { 0% {transform: rotate(0);} 25% {transform: rotate(8deg);} 75% {transform: rotate(-8deg);} 100% {transform: rotate(0);} }
        #message-box { display: none; margin-top: 10px; padding: 0 20px; }
        .whatsapp-btn { display: inline-block; margin-top: 30px; padding: 15px 30px; background: #25D366; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 18px; }
        h1 { color: #f1c40f; }
    </style>
</head>
<body onclick="startMagic()">

    <div id="gift" class="gift-box">🎁</div>
    <h1 id="status">Tap to Open Surprise</h1>
    
    <img id="cust-photo" src="demo-photo.png" alt="Photo">
    <audio id="myaudio" src="full-song.mp3" loop></audio>

    <div id="message-box">
        <p style="font-size: 18px;">Listen Carefully! 🎵</p>
        <a href="https://wa.me/916263619677" class="whatsapp-btn">ORDER YOUR MAGIC QR NOW</a>
    </div>

    <div style="margin-top: 50px; font-size: 12px; color: #bdc3c7;">
        <p>DSK DIGITAL SURPRISE | TM NO: 13512170</p>
    </div>

    <script>
        function startMagic() {
            const audio = document.getElementById('myaudio');
            document.getElementById('gift').style.display = "none";
            document.getElementById('cust-photo').style.display = "block";
            document.getElementById('message-box').style.display = "block";
            document.getElementById('status').innerText = "Special Surprise for Rahul";
            audio.play().catch(e => console.log("Tap again"));
        }
    </script>
</body>
</html>
